<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2단원 - 아코디언 FAQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>자주 묻는 질문</h1>
 
  <!-- .faq(부모)에 이벤트를 위임한다. 자식 .faq-question 클릭만 처리 -->
  <div class="faq">
    <div class="faq-item">
      <button class="faq-question">jQuery가 뭔가요?</button>
      <div class="faq-answer">자바스크립트를 더 쉽게 쓸 수 있게 도와주는 라이브러리입니다.</div>
    </div>
 
    <div class="faq-item">
      <button class="faq-question">왜 배우나요?</button>
      <div class="faq-answer">DOM 조작, 이벤트, 비동기 통신의 개념을 익히기 좋습니다.</div>
    </div> 
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
